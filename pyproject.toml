[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-bias-evaluation"
version = "1.0.0"
description = "Reproducible bias evaluation of JEV and KEV direct-decision models"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "MIT"}
authors = [{name = "Glax147"}]
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.1",
  "matplotlib==3.10.7",
  "seaborn==0.13.2",
  "requests==2.32.5",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
data = [
  "pyarrow==25.0.1",
  "tqdm==4.67.1",
  "huggingface-hub==1.32.0",
  "datasets==3.6.0",
  "beautifulsoup4==4.14.2",
  "convokit==3.4.1",
]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
